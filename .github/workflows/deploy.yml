name: Aggiorna sito automaticamente

on:
  push:
    branches: [claude/web-crm-app-JO1x4]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-gh-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/web-crm-app-JO1x4
          fetch-depth: 0

      - name: Sincronizza gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git push origin HEAD:gh-pages --force
