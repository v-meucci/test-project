<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyCRM</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <span class="logo-icon">◈</span>
      <span class="logo-text">MyCRM</span>
    </div>
    <nav class="sidebar-nav">
      <button class="nav-btn active" data-view="contacts">
        <span class="nav-icon">👤</span> Contatti
      </button>
      <button class="nav-btn" data-view="activities">
        <span class="nav-icon">📋</span> Attività
      </button>
    </nav>
  </aside>

  <!-- MAIN -->
  <main class="main">

    <!-- HEADER -->
    <header class="topbar">
      <h1 class="topbar-title" id="view-title">Contatti</h1>
      <button class="btn-primary" id="add-btn">+ Aggiungi</button>
    </header>

    <!-- SEARCH -->
    <div class="search-bar">
      <input type="text" id="search-input" placeholder="Cerca..." />
    </div>

    <!-- VIEWS -->
    <section id="view-contacts" class="view active">
      <div id="contacts-list" class="card-grid"></div>
      <p id="contacts-empty" class="empty-msg hidden">Nessun contatto. Clicca "+ Aggiungi" per iniziare.</p>
    </section>

    <section id="view-activities" class="view">
      <div id="activities-list" class="activity-feed"></div>
      <p id="activities-empty" class="empty-msg hidden">Nessuna attività registrata.</p>
    </section>

  </main>

  <!-- MODAL CONTATTO -->
  <div id="modal-contact" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-contact-title">Nuovo Contatto</h2>
        <button class="modal-close" data-modal="modal-contact">✕</button>
      </div>
      <form id="form-contact">
        <label>Nome *
          <input type="text" id="contact-name" placeholder="es. Mario Rossi" required />
        </label>
        <label>Azienda
          <input type="text" id="contact-company" placeholder="es. Acme Srl" />
        </label>
        <label>Email
          <input type="email" id="contact-email" placeholder="es. mario@acme.it" />
        </label>
        <label>Telefono
          <input type="tel" id="contact-phone" placeholder="es. +39 02 1234567" />
        </label>
        <label>Descrizione / Note
          <textarea id="contact-desc" rows="3" placeholder="Informazioni utili su questo contatto..."></textarea>
        </label>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" data-modal="modal-contact">Annulla</button>
          <button type="submit" class="btn-primary">Salva</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL ATTIVITÀ -->
  <div id="modal-activity" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h2>Nuova Attività</h2>
        <button class="modal-close" data-modal="modal-activity">✕</button>
      </div>
      <form id="form-activity">
        <label>Tipo *
          <select id="activity-type" required>
            <option value="">— Seleziona —</option>
            <option value="chiamata">📞 Chiamata</option>
            <option value="email">✉️ Email</option>
            <option value="riunione">🤝 Riunione</option>
            <option value="nota">📝 Nota</option>
            <option value="offerta">💼 Offerta</option>
          </select>
        </label>
        <label>Contatto associato *
          <select id="activity-contact" required>
            <option value="">— Seleziona contatto —</option>
          </select>
        </label>
        <label>Data
          <input type="date" id="activity-date" />
        </label>
        <label>Descrizione *
          <textarea id="activity-desc" rows="3" placeholder="Descrivi l'attività..." required></textarea>
        </label>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" data-modal="modal-activity">Annulla</button>
          <button type="submit" class="btn-primary">Salva</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL DETTAGLIO CONTATTO -->
  <div id="modal-detail" class="modal-overlay hidden">
    <div class="modal modal-wide">
      <div class="modal-header">
        <h2 id="detail-name">—</h2>
        <button class="modal-close" data-modal="modal-detail">✕</button>
      </div>
      <div id="detail-info" class="detail-info"></div>
      <div class="detail-section">
        <div class="detail-section-header">
          <h3>Attività</h3>
          <button class="btn-primary btn-sm" id="detail-add-activity">+ Attività</button>
        </div>
        <div id="detail-activities" class="activity-feed"></div>
        <p id="detail-empty" class="empty-msg hidden">Nessuna attività per questo contatto.</p>
      </div>
      <div class="modal-actions">
        <button class="btn-danger" id="detail-delete">Elimina contatto</button>
        <button class="btn-secondary" id="detail-edit">Modifica</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
